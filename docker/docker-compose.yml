version: '3.8'

services:
  # PostgreSQL 18 - Relational Database
  postgres:
    image: postgres:18-alpine
    container_name: rightstaff-postgres
    environment:
      POSTGRES_DB: rightstaff
      POSTGRES_USER: right_staff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
    ports:
      - "5432:5432"
    volumes:
      - rightstaff-postgres-data:/var/lib/postgresql/data
      - ../database/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U right_staff -d rightstaff"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rightstaff-network

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: rightstaff-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ../data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s   
    networks:
      - rightstaff-network

  # Redis - Cache & Queue
  redis:
    image: redis:7.2-alpine
    container_name: rightstaff-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev_redis_123}
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rightstaff-network

  # MinIO - S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: rightstaff-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web Console
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rightstaff-network

networks:
  rightstaff-network:
    driver: bridge

volumes:
  rightstaff-postgres-data:
    driver: local
